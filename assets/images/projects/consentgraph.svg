<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<title>PN-07 consentgraph schematic</title>
<desc>Synthetic candidate links are loaded above a threshold into in-memory SQLite. profileFor walks purpose-scoped edges and evaluate scores precision and household confusions. Marketing precision is 1.0000 over 1,432 records and 472 people.</desc>
<defs>
<pattern id="minor" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#EAF3FB" stroke-opacity="0.05" stroke-width="1"/></pattern>
<pattern id="major" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#EAF3FB" stroke-opacity="0.09" stroke-width="1"/></pattern>
<marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#EAF3FB" fill-opacity="0.8"/></marker>
<marker id="ak" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9FDBFF"/></marker>
<style>.t{font-family:"IBM Plex Mono, SFMono-Regular, Consolas, monospace";font-size:10px;letter-spacing:.06em;fill:#EAF3FB}.s{font-size:9px;fill-opacity:.7}.n{font-size:11px;fill:#9FDBFF}</style>
</defs>

<rect width="640" height="360" fill="#0D3B66"/>
<rect width="640" height="360" fill="url(#minor)"/>
<rect width="640" height="360" fill="url(#major)"/>

<rect x="16" y="16" width="608" height="24" fill="#0D3B66" stroke="#EAF3FB" stroke-opacity="0.5" stroke-width="1"/>
<text x="28" y="32" class="t">PN-07 · CONSENTGRAPH · CONSENT-GATED IDENTITY RESOLUTION</text>

<rect x="16" y="60" width="120" height="56" fill="#0D3B66" stroke="#EAF3FB" stroke-opacity="0.6" stroke-width="1"/>
<text x="76" y="82" class="t" text-anchor="middle">FIXTURES</text>
<text x="76" y="98" class="t s" text-anchor="middle">households, ids</text>

<rect x="160" y="60" width="140" height="56" fill="#0D3B66" stroke="#EAF3FB" stroke-opacity="0.6" stroke-width="1"/>
<text x="230" y="82" class="t" text-anchor="middle">CANDIDATES</text>
<text x="230" y="98" class="t s" text-anchor="middle">det. + name/postcode</text>

<rect x="324" y="60" width="110" height="56" fill="#0D3B66" stroke="#EAF3FB" stroke-opacity="0.6" stroke-width="1"/>
<text x="379" y="82" class="t" text-anchor="middle">LOAD GRAPH</text>
<text x="379" y="98" class="t s" text-anchor="middle">threshold cut</text>

<rect x="458" y="60" width="166" height="56" fill="#0D3B66" stroke="#EAF3FB" stroke-opacity="0.6" stroke-width="1"/>
<text x="541" y="82" class="t" text-anchor="middle">SQLITE (MEMORY)</text>
<text x="541" y="98" class="t s" text-anchor="middle">record · edge · consent</text>

<line x1="136" y1="88" x2="160" y2="88" stroke="#EAF3FB" stroke-opacity="0.8" stroke-width="1" marker-end="url(#ah)"/>
<line x1="300" y1="88" x2="324" y2="88" stroke="#EAF3FB" stroke-opacity="0.8" stroke-width="1" marker-end="url(#ah)"/>
<line x1="434" y1="88" x2="458" y2="88" stroke="#EAF3FB" stroke-opacity="0.8" stroke-width="1" marker-end="url(#ah)"/>

<rect x="300" y="190" width="140" height="56" fill="#0D3B66" stroke="#9FDBFF" stroke-width="1"/>
<text x="370" y="212" class="t" text-anchor="middle">PROFILEFOR</text>
<text x="370" y="228" class="t s" text-anchor="middle">recursive CTE</text>

<rect x="468" y="190" width="156" height="56" fill="#0D3B66" stroke="#EAF3FB" stroke-opacity="0.6" stroke-width="1"/>
<text x="546" y="212" class="t" text-anchor="middle">EVALUATE</text>
<text x="546" y="228" class="t s" text-anchor="middle">precision, recall</text>

<path d="M490 116 V152 H370 V188" fill="none" stroke="#9FDBFF" stroke-width="1" marker-end="url(#ak)"/>
<line x1="580" y1="116" x2="580" y2="188" stroke="#EAF3FB" stroke-opacity="0.8" stroke-width="1" marker-end="url(#ah)"/>

<text x="300" y="262" class="t" fill="#9FDBFF">PURPOSE-SCOPED EDGES ONLY</text>

<line x1="546" y1="246" x2="546" y2="274" stroke="#9FDBFF" stroke-width="1" marker-end="url(#ak)"/>

<rect x="16" y="276" width="190" height="56" fill="#0D3B66" stroke="#EAF3FB" stroke-opacity="0.6" stroke-width="1"/>
<text x="28" y="300" class="t n">1,432</text>
<text x="28" y="318" class="t s">SOURCE RECORDS</text>

<rect x="226" y="276" width="190" height="56" fill="#0D3B66" stroke="#EAF3FB" stroke-opacity="0.6" stroke-width="1"/>
<text x="238" y="300" class="t n">472</text>
<text x="238" y="318" class="t s">REAL PEOPLE</text>

<rect x="436" y="276" width="188" height="56" fill="#0D3B66" stroke="#9FDBFF" stroke-width="1"/>
<text x="448" y="300" class="t n">1.0000</text>
<text x="448" y="318" class="t s">PRECISION · MARKETING</text>
</svg>