<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <title>PN-09 dmarcwatch pipeline schematic</title>
  <desc>Blueprint of the dmarcwatch pipeline: RUA XML reports pass through xml.ts and rua.ts into analyse.ts, which feeds the console demo and the browser analysis. fixtures.ts supplies the seeded corpus. Readouts show 145 reports, 520,302 messages and the DMARC pass rate drop from 100.0% to 15.0%.</desc>
  <defs>
    <pattern id="minor" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#EAF3FB" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#EAF3FB" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#EAF3FB" fill-opacity="0.8"/>
    </marker>
    <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9FDBFF"/>
    </marker>
  </defs>

  <!-- background and grid -->
  <rect x="0" y="0" width="640" height="360" fill="#0D3B66"/>
  <rect x="0" y="0" width="640" height="360" fill="url(#minor)"/>
  <rect x="0" y="0" width="640" height="360" fill="url(#major)"/>

  <!-- title strip -->
  <rect x="0" y="0" width="640" height="28" fill="#0D3B66" stroke="#EAF3FB" stroke-opacity="0.4" stroke-width="1"/>
  <text x="16" y="18" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="0.06em" fill="#EAF3FB">PN-09 · DMARCWATCH · DELIVERABILITY VS ENGAGEMENT</text>

  <!-- main path arrows -->
  <path d="M144 152H176" fill="none" stroke="#9FDBFF" stroke-width="1" marker-end="url(#ahA)"/>
  <path d="M288 152H320" fill="none" stroke="#9FDBFF" stroke-width="1" marker-end="url(#ahA)"/>
  <path d="M432 152H456" fill="none" stroke="#9FDBFF" stroke-width="1" marker-end="url(#ahA)"/>

  <!-- analysis outputs -->
  <path d="M480 184V208H384V232" fill="none" stroke="#EAF3FB" stroke-opacity="0.6" stroke-width="1" marker-end="url(#ah)"/>
  <path d="M552 184V232" fill="none" stroke="#EAF3FB" stroke-opacity="0.6" stroke-width="1" marker-end="url(#ah)"/>

  <!-- fixtures feed -->
  <path d="M80 232V184" fill="none" stroke="#EAF3FB" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#ah)"/>

  <!-- boxes -->
  <g font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" letter-spacing="0.06em" fill="#EAF3FB">
    <!-- RUA reports -->
    <rect x="16" y="120" width="128" height="64" fill="#0D3B66" stroke="#EAF3FB" stroke-opacity="0.6" stroke-width="1"/>
    <text x="24" y="140" font-size="10">RUA XML</text>
    <text x="24" y="156" font-size="9" fill-opacity="0.7">5 PROVIDER</text>
    <text x="24" y="170" font-size="9" fill-opacity="0.7">DIALECTS</text>

    <!-- xml.ts -->
    <rect x="176" y="120" width="112" height="64" fill="#0D3B66" stroke="#EAF3FB" stroke-opacity="0.6" stroke-width="1"/>
    <text x="184" y="140" font-size="10">XML.TS</text>
    <text x="184" y="156" font-size="9" fill-opacity="0.7">DEPENDENCY-FREE</text>
    <text x="184" y="170" font-size="9" fill-opacity="0.7">READER</text>

    <!-- rua.ts -->
    <rect x="320" y="120" width="112" height="64" fill="#0D3B66" stroke="#EAF3FB" stroke-opacity="0.6" stroke-width="1"/>
    <text x="328" y="140" font-size="10">RUA.TS</text>
    <text x="328" y="156" font-size="9" fill-opacity="0.7">TOLERANT PARSER</text>
    <text x="328" y="170" font-size="9" fill-opacity="0.7">+ ALIGNMENT</text>

    <!-- analyse.ts -->
    <rect x="456" y="120" width="160" height="64" fill="#0D3B66" stroke="#9FDBFF" stroke-width="1"/>
    <text x="464" y="140" font-size="10" fill="#9FDBFF">ANALYSE.TS</text>
    <text x="464" y="156" font-size="9" fill-opacity="0.7">SOURCES, SPOOFING</text>
    <text x="464" y="170" font-size="9" fill-opacity="0.7">ROOT CAUSE, CHANGEPOINT</text>

    <!-- fixtures.ts -->
    <rect x="16" y="232" width="128" height="52" fill="#0D3B66" stroke="#EAF3FB" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="24" y="250" font-size="10">FIXTURES.TS</text>
    <text x="24" y="264" font-size="9" fill-opacity="0.7">SEEDED GENERATOR</text>
    <text x="24" y="276" font-size="9" fill-opacity="0.7">+ GROUND TRUTH</text>

    <!-- demo.ts -->
    <rect x="320" y="232" width="128" height="40" fill="#0D3B66" stroke="#EAF3FB" stroke-opacity="0.6" stroke-width="1"/>
    <text x="328" y="248" font-size="10">DEMO.TS</text>
    <text x="328" y="262" font-size="9" fill-opacity="0.7">CONSOLE REPORT</text>

    <!-- site/core.mjs -->
    <rect x="456" y="232" width="160" height="40" fill="#0D3B66" stroke="#EAF3FB" stroke-opacity="0.6" stroke-width="1"/>
    <text x="464" y="248" font-size="10">SITE/CORE.MJS</text>
    <text x="464" y="262" font-size="9" fill-opacity="0.7">BROWSER ANALYSIS</text>

    <!-- readouts -->
    <rect x="16" y="300" width="128" height="36" fill="#0D3B66" stroke="#EAF3FB" stroke-opacity="0.4" stroke-width="1"/>
    <text x="24" y="322" font-size="11">145 REPORTS</text>

    <rect x="152" y="300" width="160" height="36" fill="#0D3B66" stroke="#EAF3FB" stroke-opacity="0.4" stroke-width="1"/>
    <text x="160" y="322" font-size="11">520,302 MESSAGES</text>

    <rect x="328" y="300" width="288" height="36" fill="#0D3B66" stroke="#9FDBFF" stroke-width="1"/>
    <text x="336" y="322" font-size="11" fill="#9FDBFF">DMARC 100.0% → 15.0%</text>
  </g>
</svg>